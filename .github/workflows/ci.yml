name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rug
          POSTGRES_PASSWORD: rug
          POSTGRES_DB: rug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rug"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUG_TEST_DATABASE_URL: postgresql+psycopg://rug:rug@localhost:5432/rug_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages (OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    # Real API + built frontend in Chromium, with a mock directory and FAKE models: this checks
    # the plumbing (sign-in, ask, cited answer, download, upload), not answer quality.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rug
          POSTGRES_PASSWORD: rug
          POSTGRES_DB: rug_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rug"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUG_E2E_DATABASE_URL: postgresql+psycopg://rug:rug@localhost:5432/rug_e2e
      RUG_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages (OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - name: Backend install
        run: pip install -e backend
      - name: Frontend install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results

  deploy:
    # Builds the image and runs the real Caddy + Postgres containers with the test harness
    # (mock directory, fake models): TLS, streaming through the proxy, cookies, client
    # addresses, checksums, backup and restore. Not production sign-in, Ollama or a GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        working-directory: deploy
        run: |
          touch .env
          export POSTGRES_PASSWORD=x DOCS_DIR=/tmp
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          rm .env
      - name: Smoke test
        run: deploy/smoke.sh
