name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rug
          POSTGRES_PASSWORD: rug
          POSTGRES_DB: rug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rug"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUG_TEST_DATABASE_URL: postgresql+psycopg://rug:rug@localhost:5432/rug_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages (OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Tests
        run: pytest -q
