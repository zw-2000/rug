# Golden questions over the synthetic corpus (eval/synthetic_gen.py). Everything is fictional.
#
# Per question:
#   kind      named        the question names a document; it must resolve to `doc`
#             find         no document named; `doc` must be among the excerpts and sources
#             unanswerable the corpus cannot answer it; the reply must be "not found"
#   det       true when "not found" is decided without the model (unknown ID, empty scope)
#   facts     groups of alternatives; every group must appear (any alternative) in the text
#   absent    text that must not appear (superseded versions, tracked deletions)
#   forbidden text from documents outside the scope; must never reach the model or the answer
#
# Deterministic metrics (no model needed) gate CI; the model-dependent ones are checked with
# `rug eval --live` on the GPU server.
thresholds:
  document: 0.95    # named questions resolved to the right document
  retrieval: 0.90   # key facts are in the excerpts the model is shown
  citation: 0.90    # live: cited excerpts contain the key facts
  answer: 0.80      # live: the answer contains the key facts
  not_found: 0.90   # unanswerable questions get "not found"
  leaks: 0          # nothing outside the scope reaches the model, the answer or the sources

scopes:
  all: [sales, delivery, legal]
  no_legal: [sales, delivery]
  sales_only: [sales]
  nothing: []

questions:
